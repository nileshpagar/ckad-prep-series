apiVersion: v1
kind: Pod
metadata:
  name: sidecar-logger-pod
spec:
  volumes:
  - name: log-vol
    emptyDir: {}
  containers:
  - name: app-container
    image: busybox
    command: ["sh", "-c", "while true; do echo $(date) 'App running...' >> /var/log/app.log; sleep 1; done"]
    volumeMounts:
    - name: log-vol
      mountPath: /var/log
  - name: sidecar-container
    image: busybox
    command: ["sh", "-c", "tail -n+1 -f /var/log/app.log"]
    volumeMounts:
    - name: log-vol
      mountPath: /var/log
